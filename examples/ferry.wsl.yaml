# Агент в WSL. Порт 7421, чтобы не столкнуться с агентом Windows на 7420.
# WIN_HOST задаёт examples/start-wsl.sh — это IP Windows со стороны WSL.
node:
  id: wsl
  listen: "0.0.0.0:7421"
  token: "change-me-to-a-long-random-token"
  data_dir: "/home/USER/ferry/data"
  log_level: info
  scenarios: "scenarios.wsl.yaml"
  allowed_roots:
    - "/home/USER/ferry"
  inbound:
    - name: inbox
      path: "/home/USER/ferry/inbox"
    - name: archive
      path: "/home/USER/ferry/archive"
  tls:
    cert_file: "/home/USER/ferry/certs/cert.pem"
    key_file: "/home/USER/ferry/certs/key.pem"

peers:
  - id: win
    url: "https://${WIN_HOST}:7420"
    token: "change-me-to-a-long-random-token"
    tls_skip_verify: true
